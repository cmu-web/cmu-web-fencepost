<!doctype html>
<!-- A made-up page for FencePost's hero; node scripts/render-hero.mjs takes
     its screenshot. Open it in a browser to edit. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat</title>
    <link rel="stylesheet" href="hero.css" />
  </head>
  <body class="chat-page">
    <div class="status"
      ><span>9:41</span><span></span
      ><span class="icons"
        ><svg width="27" height="18" viewBox="0 0 27 18" fill="currentColor" aria-hidden="true">
          <rect x="0" y="12" width="5" height="6" rx="1.5" />
          <rect x="7.3" y="8.5" width="5" height="9.5" rx="1.5" />
          <rect x="14.6" y="5" width="5" height="13" rx="1.5" />
          <rect x="21.9" y="1.5" width="5" height="16.5" rx="1.5" /></svg
        ><svg width="36" height="18" viewBox="0 0 36 18" aria-hidden="true">
          <rect
            x="1"
            y="1"
            width="30"
            height="16"
            rx="4.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <rect x="4" y="4" width="21" height="10" rx="2" fill="currentColor" />
          <rect x="33" y="6" width="2.5" height="6" rx="1.2" fill="currentColor" /></svg></span
    ></div>
    <div class="contact"
      ><div class="avatar">MM</div
      ><div><div class="name">Margaret Morrison</div><div class="online">Online</div></div></div
    >
    <div class="chat"
      ><p class="date">Today 9:38 AM</p>
      <p class="message">Is there a kit for building our site in CMU's template?</p>
      <p class="message reply">There is! Sending you the link.</p>
      <div class="preview"
        ><img
          src="../../docs/images/webkilt-preview.jpg"
          alt="Carnegie Mellon Web Kilt home page"
        />
        <div class="details"
          ><p class="domain">webkilt.andrew.cmu.edu</p><p class="title">Carnegie Mellon Web Kilt</p
          ><p class="description"
            >Components and working examples that fit CMU's web template.</p
          ></div
        >
      </div>
    </div>
    <div class="composer"
      ><span class="url">https://webkilt.andrew.cmu.edu/</span><span class="send">➤</span></div
    >
  </body>
</html>
