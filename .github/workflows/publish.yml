name: Check and publish

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every check, in the Dockerfile's test stage, so CI uses the image's
  # Node and npm
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Builds the image on every run; pushes only for releases (version tags or
  # a manual run)
  image:
    needs: check
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cmu-web/cmu-web-fencepost
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The WordPress plugin: PHP syntax on every run; for a version tag, its
  # zip (fencepost/ inside fencepost-wordpress.zip, without the tests) on the
  # tag's GitHub release, once the release exists
  wordpress:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the PHP
        run: for f in packages/wordpress/*.php packages/wordpress/tests/*.php; do php -l "$f"; done
      - name: Zip the plugin
        run: |
          mkdir -p build/fencepost
          cp packages/wordpress/fencepost.php packages/wordpress/uninstall.php packages/wordpress/readme.txt LICENSE build/fencepost/
          (cd build && zip -r ../fencepost-wordpress.zip fencepost)
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" fencepost-wordpress.zip --clobber
