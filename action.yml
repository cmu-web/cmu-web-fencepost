name: Make Preview Images
description: >-
  Make a page's link preview image (1200 × 630, under 300 KB) and screenshots
  in a GitHub or Forgejo workflow, before the site is published. Captures any
  address the job can reach, including a site the job serves at 127.0.0.1.
author: CMU Web
branding:
  icon: image
  color: red

inputs:
  url:
    description: The page to capture, such as http://127.0.0.1:4000/ for a site the job serves.
    required: true
  preview:
    description: >-
      Where to write the preview image, relative to the workspace. Defaults to
      images/preview.jpg when card and phone are blank too; set it to blank to
      skip the preview when asking for a card or phone screenshot.
    default: images/preview.jpg
  card:
    description: Where to write a 1040 × 656 screenshot of the page on a computer (.webp, .png or .jpg). Blank skips it.
    default: ""
  phone:
    description: Where to write a 430 × 790 screenshot of the page on a phone, at double resolution (.webp, .png or .jpg). Blank skips it.
    default: ""
  public-url:
    description: The page's published address. With it, the tags output has the Open Graph tags; without it, tags is blank.
    default: ""
  site:
    description: The site's name, for og:site_name.
    default: ""
  image-path:
    description: Where the site will serve the preview image, for og:image.
    default: /images/preview.jpg
  delay:
    description: >-
      Seconds to wait after the page loads before taking the screenshots, 0 to
      10, for content that animates in or loads late, such as numbers that
      count up.
    default: "0"
  container-image:
    description: >-
      The FencePost container image to run. Blank runs the release's
      container image, the same version as this action; set it to test a
      container image the workflow just built.
    default: ""

outputs:
  title:
    description: The page's title.
    value: ${{ steps.shoot.outputs.title }}
  description:
    description: The page's meta description.
    value: ${{ steps.shoot.outputs.description }}
  preview:
    description: The preview image's path, when one was written.
    value: ${{ steps.shoot.outputs.preview }}
  card:
    description: The card screenshot's path, when one was written.
    value: ${{ steps.shoot.outputs.card }}
  phone:
    description: The phone screenshot's path, when one was written.
    value: ${{ steps.shoot.outputs.phone }}
  tags:
    description: The Open Graph tags, when public-url was given.
    value: ${{ steps.shoot.outputs.tags }}

runs:
  using: composite
  steps:
    - id: shoot
      shell: bash
      env:
        # FencePost's release container image, the same version as this action;
        # npm run check:action keeps it matched to package.json
        RELEASE_IMAGE: ghcr.io/cmu-web/cmu-web-fencepost:0.2.2
        FP_CONTAINER_IMAGE: ${{ inputs.container-image }}
        FP_URL: ${{ inputs.url }}
        FP_PREVIEW: ${{ inputs.preview }}
        FP_CARD: ${{ inputs.card }}
        FP_PHONE: ${{ inputs.phone }}
        FP_PUBLIC_URL: ${{ inputs.public-url }}
        FP_SITE: ${{ inputs.site }}
        FP_IMAGE_PATH: ${{ inputs.image-path }}
        FP_DELAY: ${{ inputs.delay }}
      # FencePost runs in its own container next to the job, sharing the job's
      # network (so 127.0.0.1 is the job's) and workspace, as the job's user
      run: |
        set -euo pipefail
        # Where the job runs. In a container (a Forgejo runner's usual setup,
        # or a GitHub job with container:), join that container: Forgejo
        # names it in JOB_CONTAINER_NAME; otherwise it's the hostname. On the
        # runner itself (GitHub's usual setup), use the host's network and
        # mount the workspace.
        job=""
        if [ -n "${JOB_CONTAINER_NAME:-}" ] && docker container inspect "$JOB_CONTAINER_NAME" >/dev/null 2>&1; then
          job="$JOB_CONTAINER_NAME"
        elif [ -f /.dockerenv ] && docker container inspect "$(hostname)" >/dev/null 2>&1; then
          job="$(hostname)"
        fi
        if [ -n "$job" ]; then
          echo "FencePost: in job container $job"
          where=(--network "container:$job" --volumes-from "$job" -w "$GITHUB_WORKSPACE")
        else
          echo "FencePost: on the runner"
          where=(--network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE")
        fi
        docker run --rm "${where[@]}" \
          --user "$(id -u):$(id -g)" -e HOME=/tmp --tmpfs /tmp \
          "${FP_CONTAINER_IMAGE:-$RELEASE_IMAGE}" node /app/dist/cli.js "$FP_URL" \
          --preview "$FP_PREVIEW" --card "$FP_CARD" --phone "$FP_PHONE" \
          --public-url "$FP_PUBLIC_URL" --site "$FP_SITE" --image-path "$FP_IMAGE_PATH" \
          --delay "$FP_DELAY" \
          --outputs github >>"$GITHUB_OUTPUT"
